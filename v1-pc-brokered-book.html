<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P&C Brokered Book — Indigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#171614; --bistre:#3A2618; --garnet:#754043; --beaver:#9A8873; --olive:#37423D;
    --ink:#1C211E; --navy:#1C211E; --dark:#3A2618; --mid:#754043;
    /* Black Olive taken deeper for the rail and the scorecard band; the page
       itself moves to near-white so the greens and the garnet read as the only
       saturated things on screen. */
    --forest:#243835; --forest2:#293934; --forest3:#33443D;
    --paper:#FBFAF8; --card:#FFFFFF; --pale:#F4F4F1; --line:#E4E5E1; --line2:#EDEEEA;
    --gold:#9A8873; --gray:#616861; --muted:#8B928A;
    --r:12px; --r-sm:8px;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  .shell{display:flex;height:100vh;overflow:hidden}
  .workspace{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  ::selection{background:var(--garnet);color:#fff}

  /* ---- side rail ---- */
  .side{flex:0 0 246px;width:246px;background:var(--forest);display:flex;flex-direction:column;
    border-right:1px solid rgba(154,136,115,.28);overflow-y:auto}
  .side-brand{padding:30px 24px 24px;border-bottom:0}
  .brand{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.06;letter-spacing:.12em;
    text-transform:uppercase;margin:0;color:#F1EBE0}
  .side-sub{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#93A29A;margin:12px 0 0;font-weight:600;line-height:1.7}
  .nav{display:flex;flex-direction:column;padding:6px 12px;gap:2px;flex:1 1 auto}
  .nav-div{height:1px;background:rgba(255,255,255,.11);margin:12px 14px}
  .nav button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.005em;text-transform:none;
    padding:11px 14px;border:0;border-radius:var(--r-sm);background:none;
    color:#D5DDD8;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
  .nav button svg{width:18px;height:18px;flex:0 0 18px;color:#93A29A;transition:color .15s}
  .nav button span{flex:1 1 auto;line-height:1.3;white-space:nowrap}
  .nav button:hover:not(.active):not(:disabled){background:rgba(255,255,255,.06);color:#FFFFFF}
  .nav button:hover:not(.active):not(:disabled) svg{color:#D5DDD8}
  .nav button.active{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.035));
    color:#FFFFFF;box-shadow:inset 3px 0 0 #C7D2CC}
  .nav button.active svg{color:#FFFFFF}
  .nav button:disabled{color:rgba(213,221,216,.4);cursor:not-allowed}
  .nav button:disabled svg{color:rgba(147,162,154,.4)}
  .nav button:focus-visible{outline:1px solid #93A29A;outline-offset:-2px}
  /* red renewal badge on a nav button — hidden entirely when the count is zero,
     so an empty badge never sits there looking like an unread marker */
  .nav-alert{display:none;flex:0 0 auto;min-width:19px;height:19px;padding:0 6px;border-radius:999px;
    background:#A83E4B;color:#FFF3EE;font-family:var(--sans);font-size:9.5px;font-weight:700;
    letter-spacing:.02em;line-height:19px;text-align:center;
    box-shadow:0 0 0 2px rgba(36,56,53,.7)}
  .nav-alert.on{display:block;animation:navPulse 2.6s ease-in-out infinite}
  @keyframes navPulse{0%,100%{opacity:1}50%{opacity:.6}}
  @media (prefers-reduced-motion:reduce){ .nav-alert.on{animation:none} }
  /* renewal alert strip at the head of the Farmers book */
  .ralert{margin:0 0 20px;border:1px solid #E7CBCC;border-left:3px solid #A83E4B;border-radius:var(--r);
    background:#FCF4F3;padding:15px 20px 16px}
  .ralert-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .ralert-h svg{width:15px;height:15px;flex:0 0 15px;color:#A83E4B}
  .ralert-h h3{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#A83E4B;margin:0}
  .ralert-n{margin-left:auto;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:#A83E4B}
  .ralert-row{display:grid;grid-template-columns:1fr 150px 82px 108px;gap:16px;align-items:baseline;
    padding:8px 0;border-top:1px solid rgba(168,62,75,.18);cursor:pointer}
  .ralert-row:hover{background:rgba(168,62,75,.06)}
  .ralert-row:focus-visible{outline:1px solid #A83E4B;outline-offset:-1px}
  .ralert-nm{font-size:13px;font-weight:600;color:var(--night)}
  .ralert-sub{font-size:10.5px;color:var(--gray);margin-top:2px}
  .ralert-dt{font-size:12px;color:var(--bistre)}
  .ralert-d{font-size:12px;font-weight:700;color:#A83E4B;text-align:right}
  .ralert-p{font-size:12px;font-weight:700;color:var(--night);text-align:right}
  .ralert.quiet{border-color:var(--line);border-left-color:var(--muted);background:var(--pale)}
  .ralert.quiet .ralert-h svg,.ralert.quiet .ralert-h h3,.ralert.quiet .ralert-n{color:var(--beaver)}
  .ralert-note{font-size:12px;color:var(--gray);line-height:1.55}
  .ralert-note b{color:var(--night);font-weight:600}
  @media (max-width:820px){ .ralert-row{grid-template-columns:1fr auto;gap:6px 14px}
    .ralert-dt,.ralert-d,.ralert-p{text-align:left} }
  .side-foot{padding:14px 12px 20px;border-top:1px solid rgba(255,255,255,.11);margin:0 0 0}
  .logout{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.005em;text-transform:none;
    padding:11px 14px;border:0;border-radius:var(--r-sm);background:none;color:#D5DDD8;cursor:pointer;
    transition:background .15s,color .15s}
  .logout svg{width:18px;height:18px;flex:0 0 18px;color:#93A29A;transition:color .15s}
  .logout:hover{background:rgba(255,255,255,.06);color:#FFFFFF}
  .logout:hover svg{color:#FFFFFF}

  /* ---- slim top bar ---- */
  header{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
    padding:16px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .hd-titles{min-width:0}
  .ptitle{font-family:var(--serif);font-size:24px;font-weight:600;margin:0;letter-spacing:.02em;color:var(--night);text-transform:none}
  .psrc{font-size:10.5px;color:var(--gray);margin:3px 0 0;letter-spacing:.01em}

  /* ---- global search ---- */
  .gsearch{position:relative;flex:0 1 420px;min-width:220px}
  .gsearch-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
  .gsearch-ico svg{width:15px;height:15px}
  #gq{width:100%;font-family:var(--sans);font-size:12.5px;letter-spacing:.01em;color:var(--ink);background:#FFFFFF;
    border:1px solid var(--line);border-radius:999px;padding:11px 34px 11px 38px;outline:none;transition:border-color .15s,box-shadow .15s}
  #gq::placeholder{color:var(--muted)}
  #gq:focus{border-color:var(--forest3);box-shadow:0 0 0 3px rgba(51,68,61,.09)}
  .gclear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--beaver);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;font-family:inherit}
  .gclear:hover{color:var(--night)}
  .gres{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    border-radius:2px;box-shadow:0 18px 40px rgba(23,22,20,.22);max-height:60vh;overflow-y:auto;padding:4px 0}
  .ghead{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--beaver);padding:12px 16px 6px}
  .gitem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border:0;border-left:2px solid transparent;
    cursor:pointer;background:none;width:100%;text-align:left;font-family:inherit}
  .gitem:hover,.gitem.sel{background:var(--pale);border-left-color:var(--garnet)}
  .gname{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--night)}
  .gsub{font-size:10.5px;color:var(--gray);margin-top:2px;letter-spacing:.01em}
  .gnum{font-size:11.5px;font-weight:600;color:var(--bistre);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.04em}
  .gempty{padding:18px 16px;font-size:12px;color:var(--gray);text-align:center}
  .gdoc{display:inline-block;margin-left:8px;font-size:8.5px;font-weight:600;letter-spacing:.14em;color:var(--garnet);
    border:1px solid var(--garnet);border-radius:2px;padding:1px 5px;vertical-align:2px;font-family:var(--sans)}

  /* ---- module surface ---- */
  main{flex:1 1 auto;min-height:0;overflow-y:auto}
  header+main{}
  #clientRoot{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--paper)}
  #clientRoot *{font-family:var(--sans)!important}
  #operateRoot{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--paper)}
  .subhdr{background:var(--forest2);color:#EEF3EF;padding:26px 32px 26px;border-bottom:0;
    margin:20px 30px 0;border-radius:var(--r)}
  /* the executive band carries the three headline figures itself, at display
     size, instead of tucking them into a corner as small stats */
  .subhdr.hero{background:linear-gradient(101deg,#1B2A27 0%,#293A33 52%,#3E564A 100%);padding:28px 34px 30px}
  .hero-stats{display:flex;flex-wrap:wrap;gap:56px;margin-top:22px}
  .hs-v{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1;letter-spacing:.01em;
    color:#FFFFFF;font-variant-numeric:tabular-nums}
  .hs-l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,243,239,.72);
    margin-top:10px;font-weight:600}
  @media(max-width:820px){ .hero-stats{gap:28px} .hs-v{font-size:34px} }
  .subhdr-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
  .eyebrow{font-size:9.5px;letter-spacing:.22em;color:#9DACA3;text-transform:uppercase;font-weight:600}
  .h1{font-family:var(--serif);font-size:32px;font-weight:600;margin-top:6px;line-height:1.05;letter-spacing:.01em}
  .stats{display:flex;gap:34px;flex-wrap:wrap}
  .stat-l{font-size:9px;letter-spacing:.2em;color:#9DACA3;text-transform:uppercase;font-weight:600}
  .stat-v{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:3px;line-height:1;font-variant-numeric:tabular-nums}
  .stat-v .pill{vertical-align:middle}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#9DACA3;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:16px;font-family:inherit}
  .back:hover{color:#FFFFFF}
  .wrap{padding:22px 30px 70px}

  /* ---- filter bar ---- */
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .bar-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .count{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);margin-right:6px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--forest);cursor:pointer;padding:9px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:#FFFFFF;transition:background .15s,color .15s,border-color .15s}
  .btn:hover{background:var(--forest);border-color:var(--forest);color:#EEF3EF}
  select.f,input.f{padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:12px;font-family:var(--sans);background:#FFFFFF;color:var(--ink);letter-spacing:.01em}
  select.f:focus,input.f:focus{outline:none;border-color:var(--forest3);box-shadow:0 0 0 3px rgba(51,68,61,.08)}
  input.f{width:300px}
  select.f:focus,input.f:focus{outline:none;border-color:var(--garnet)}

  /* ---- tables ---- */
  .table{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .thead,.trow{display:grid;align-items:center}
  .thead{font-size:9px;letter-spacing:.2em;color:var(--beaver);text-transform:uppercase;font-weight:600;padding:13px 20px;background:var(--pale);border-bottom:1px solid var(--line)}
  .trow{padding:16px 20px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px;transition:background .12s}
  .trow:last-child{border-bottom:0}
  .trow:hover{background:#F5F6F3}
  .trow:focus-visible{outline:1px solid var(--garnet);outline-offset:-1px}
  .g-client{grid-template-columns:1.6fr 1fr 110px 110px 150px}
  .g-loc{grid-template-columns:2fr 1.1fr 110px 150px}
  .cname{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--night);line-height:1.1}
  .csub{font-size:10.5px;color:var(--gray);margin-top:3px;letter-spacing:.01em}
  .tc{text-align:center}.tr{text-align:right}
  .mono{font-variant-numeric:tabular-nums}

  /* ---- chips (replace pills) ---- */
  .pill{display:inline-block;padding:3px 8px 2px;border-radius:4px;font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;background:transparent;border:1px solid currentColor;font-family:var(--sans)}
  .p-wc{color:var(--olive)} .p-auto{color:var(--bistre)} .p-umb{color:var(--garnet)} .p-ret{color:var(--beaver)}
  .p-prop{color:var(--olive)} .p-gl{color:var(--garnet)} .p-other{color:var(--beaver)}
  .exp-soon{color:#fff;background:var(--garnet);border-color:var(--garnet)}
  .exp-warn{color:var(--bistre)} .exp-ok{color:var(--beaver)}
  .pay-ok{color:var(--olive)} .pay-warn{color:var(--garnet)}
  .st-force{color:var(--olive)} .st-cancel{color:#fff;background:var(--garnet);border-color:var(--garnet)} .st-sched{color:var(--beaver)}
  .pl-home{color:var(--olive)} .pl-landlord{color:var(--bistre)} .pl-dic{color:var(--garnet)}

  /* ---- cards ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .card-h{padding:16px 22px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:transparent}
  .card-t{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--night);letter-spacing:.01em}
  .card-b{padding:20px 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 28px}
  .fl{font-size:8.5px;letter-spacing:.2em;color:var(--beaver);text-transform:uppercase;margin-bottom:5px;font-weight:600}
  .fv{font-size:13px;font-weight:500;color:var(--ink)}
  .prem{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--night);font-variant-numeric:tabular-nums}
  .note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--gray);line-height:1.65}
  .note b{color:var(--ink)}
  .empty{padding:48px 16px;text-align:center;color:var(--beaver);font-family:var(--serif);font-size:17px;font-style:italic}
  .foot{font-size:11px;color:var(--beaver);margin-top:18px;line-height:1.7;max-width:85ch}
  .foot b{color:var(--gray);font-weight:600}

  /* ---- retail book ---- */
  .g-retail{grid-template-columns:1fr .95fr 90px 1.1fr .75fr 100px 100px}
  .g-rclient{grid-template-columns:1.35fr 1.1fr 80px .9fr 130px 110px}
  .rb-band{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
  .rb-tile{flex:1 1 190px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 16px}
  .rb-tile-total{background:var(--forest);border-color:var(--forest)}
  .rb-tile-total .rb-tile-l{color:var(--beaver)}
  .rb-tile-total .rb-tile-v{color:#F1EBE0}
  .rb-tile-total .rb-tile-s{color:rgba(154,136,115,.85)}
  .rb-tile-l{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--beaver);font-weight:600}
  .rb-tile-v{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--night);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
  .rb-tile-s{font-size:10.5px;color:var(--gray);margin-top:6px}
  .rb-band-note{flex:1 1 100%;font-size:11.5px;color:var(--bistre);background:#F7F2EA;border:1px solid var(--line);border-left:2px solid var(--garnet);border-radius:var(--r-sm);padding:11px 15px}
  .rb-cut{color:var(--garnet);font-weight:700;margin-left:1px}
  .rb-missing{color:var(--beaver);font-style:italic;font-weight:400}
  .rb-warn{margin-top:18px;padding:13px 15px;border:1px solid var(--line);border-left:2px solid var(--garnet);border-radius:var(--r-sm);background:#F7F2EA;font-size:11.5px;line-height:1.6;color:var(--bistre)}
  .rb-warn b{color:var(--garnet);font-weight:600;letter-spacing:.02em}
  .rb-note{margin-top:12px;font-size:11.5px;color:var(--gray)}
  .rb-link{color:var(--garnet);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-right:12px}

  .decrow-btn{margin-top:20px;padding-top:20px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
  .decbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    padding:18px 24px;border-radius:var(--r-sm);cursor:pointer;color:#EEF3EF;background:var(--forest);
    border:1px solid var(--forest);transition:background .15s,border-color .15s}
  .decbtn:hover{background:var(--forest3);border-color:var(--garnet)}
  .decbtn:active{background:var(--garnet)}
  .decbtn:focus-visible{outline:1px solid var(--garnet);outline-offset:3px}
  .decbtn .decico{font-size:15px;line-height:1;color:var(--beaver)}

  /* ---- executive dashboard ---- */
  .kpi{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-bottom:22px}
  .kpi-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 18px}
  .kpi-hero{background:var(--forest);border-color:var(--forest)}
  .kpi-hero .kpi-l{color:#9DACA3} .kpi-hero .kpi-v{color:#EEF3EF} .kpi-hero .kpi-s{color:rgba(238,243,239,.75)}
  .kpi-bad{border-left:2px solid #A83E4B}
  .kpi-l{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--beaver);font-weight:600}
  .kpi-v{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--ink);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
  .kpi-hero .kpi-v{font-size:42px}
  .kpi-s{font-size:10.5px;color:var(--gray);margin-top:7px;line-height:1.45}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
  .panel-h{padding:18px 22px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .panel-t{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--night);line-height:1.1}
  .panel-s{font-size:10.5px;color:var(--gray);margin-top:4px}
  .panel-b{padding:20px 22px 22px}
  .p2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:1100px){ .p2{grid-template-columns:1fr} .kpi{grid-template-columns:1fr 1fr} }

  .lgnd{display:flex;gap:16px;flex-wrap:wrap}
  .lgnd-i{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);font-weight:600}
  .lgnd-i i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .ch{width:100%;height:auto;display:block;overflow:visible}
  .ch-ax{font-family:var(--sans);font-size:10px;fill:var(--beaver);letter-spacing:.04em}

<html lang="en">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#111133;
    --sub:#4B4B66;

<!-- ======================= GRID VIEW ======================= -->
<div id="gridView">
  <div class="grid-head">
    <h1>Classroom</h1>
    <p>Tap any module to open its lessons.</p>
  </div>
  <div class="grid" id="gridContainer"></div>
</div>

<!-- ======================= CLASSROOM VIEW ======================= -->
<div class="back-row" id="backRow" style="display:none;">
  <div class="back-btn" onclick="showGrid()">← Back to Classroom</div>
</div>

<div id="classView">
  <div class="class-wrap">
    <div class="sidebar">
      <div class="side-eyebrow" id="sideEyebrow">MODULE</div>
      <div class="side-progress-row">
        <span class="side-pct" id="sidePct">0%</span>
        <div class="side-track"><div class="side-fill" id="sideFill" style="width:0%"></div></div>
      </div>
      <div id="lessonList"></div>
    </div>

    <div class="content">
      <div class="content-card">
        <div class="content-head">
          <div class="content-title" id="lessonTitle">—</div>
          <div class="complete-circle" id="completeCircle" onclick="toggleComplete()">✓</div>
        </div>
        <div class="video-box">
          <div class="play-btn">▶</div>
          <div class="video-tag">Video placeholder</div>
        </div>
        <div class="content-body">
          <p class="content-desc" id="lessonDesc">—</p>
          <div class="content-tags" id="lessonTags"></div>
          <div class="nav-row">
            <button class="nav-btn" id="prevBtn" onclick="stepLesson(-1)">← Previous</button>
            <button class="nav-btn primary" id="nextBtn" onclick="stepLesson(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const colors = ['#1B1B3A','#312E9E','#5B6B6F','#3E4B3E','#4B3E4E','#3E4650','#4338CA','#2F4A47','#4A2F3A','#39433E','#312E9E','#33403F','#4338CA'];

    ]}
];

let currentModule = null;
let currentLesson = 0;
const completed = {};

function renderGrid(){
  const grid = document.getElementById('gridContainer');
  grid.innerHTML = '';
  modules.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'mcard';
    card.onclick = () => openModule(m.key);
    card.innerHTML = `
      <div class="thumb" style="background:${colors[i % colors.length]}">
        <div class="tnum">${m.num}</div>
        <div class="tlabel">${m.title}</div>
      </div>
      <div class="mbody">
        <div class="mtitle">${m.title}</div>
        <div class="mdesc">${m.desc}</div>
        <div class="ptrack"><div class="pfill" style="width:${m.progress}%"></div></div>
        <div class="ppct">${m.progress}% complete</div>
      </div>`;
    grid.appendChild(card);
  });
}

function openModule(key){
  currentModule = modules.find(m => m.key === key);
  currentLesson = 0;
  document.getElementById('gridView').style.display = 'none';
  document.getElementById('classView').style.display = 'block';
  document.getElementById('backRow').style.display = 'block';
  document.getElementById('sideEyebrow').textContent = currentModule.num + ' · ' + currentModule.title;
  renderSidebar();
  renderLesson();
  window.scrollTo(0,0);
}

function showGrid(){
  document.getElementById('gridView').style.display = 'block';
  document.getElementById('classView').style.display = 'none';
  document.getElementById('backRow').style.display = 'none';
  window.scrollTo(0,0);
}

function renderSidebar(){
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  currentModule.lessons.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'lesson-item' + (i === currentLesson ? ' active' : '');
    const key = currentModule.key + '-' + i;
    const done = completed[key];
    row.innerHTML = `
      <span class="lesson-check ${done ? 'done' : ''}">${done ? '✓' : ''}</span>
      <span>${l.t}</span>
      <span class="lesson-tagmini">${l.tags[0]}</span>`;
    row.onclick = () => { currentLesson = i; renderSidebar(); renderLesson(); };
    list.appendChild(row);
  });
  updateSideProgress();
}

function updateSideProgress(){
  const total = currentModule.lessons.length;
  let done = 0;
  currentModule.lessons.forEach((l,i) => { if(completed[currentModule.key+'-'+i]) done++; });
  const pct = Math.round((done/total)*100);
  document.getElementById('sidePct').textContent = pct + '%';
  document.getElementById('sideFill').style.width = pct + '%';
}

function renderLesson(){
  const l = currentModule.lessons[currentLesson];
  document.getElementById('lessonTitle').textContent = l.t;
  document.getElementById('lessonDesc').textContent = l.d;
  const key = currentModule.key + '-' + currentLesson;
  const circle = document.getElementById('completeCircle');
  circle.className = 'complete-circle' + (completed[key] ? ' done' : '');

  const tagWrap = document.getElementById('lessonTags');
  tagWrap.innerHTML = l.tags.map(t => `<span class="ctag">${t}</span>`).join('');

  document.getElementById('prevBtn').disabled = currentLesson === 0;
  document.getElementById('nextBtn').disabled = currentLesson === currentModule.lessons.length - 1;
  document.getElementById('nextBtn').textContent = currentLesson === currentModule.lessons.length - 1 ? 'Last lesson' : 'Next →';
}

function stepLesson(dir){
  const next = currentLesson + dir;
  if(next < 0 || next >= currentModule.lessons.length) return;
  currentLesson = next;
  renderSidebar();
  renderLesson();
}

function toggleComplete(){
  const key = currentModule.key + '-' + currentLesson;
  completed[key] = !completed[key];
  renderSidebar();
  renderLesson();
}

renderGrid();
<\/script>

  if(/RETAIL|WHOLESALE|RESTAURANT/i.test(k)) return "p-ret";
  return "p-other";
}
function expBadge(dateStr){
  const d = daysUntil(dateStr);
  let cls="exp-ok", txt=Math.round(d/30)+" mo";
  if(d<0){cls="exp-soon";txt="Expired";}
  else if(d===0){cls="exp-soon";txt="Today";}
  else if(d<=45){cls="exp-soon";txt=d+"d left";}
  else if(d<=120){cls="exp-warn";txt=d+"d left";}
  return '<span class="pill '+cls+'">'+txt+'</span>';
}

/* ---------- executive dashboard ----------
   Chart hues are the brand's garnet / bistre / olive pushed to chart-legal
   chroma and lightness; the trio was run through the six-check validator
   (lightness band, chroma floor, CVD separation, normal-vision floor,
   contrast vs surface) and passes on this cream surface. Fixed order,
   never cycled. */
const CHART = { Commercial:"#A83E4B", Farmers:"#C08438", Retail:"#1F7A57" };
const CH_MUTE = "#C3B8A8", CH_GRID = "#E5DCCD", CH_ACCENT = "#A83E4B";
const BOOK_TAB = { Commercial:"commercial", Farmers:"farmers", Retail:"retail" };
const BOOK_NAME = { Commercial:"Commercial", Farmers:"Farmers", Retail:"P&C Brokered" };

function execRows(){
  const rows=[];
  (DATA.commercial||[]).forEach(c=>c.locations.forEach(l=>l.policies.forEach(p=>rows.push({
    book:"Commercial", label:l.name, client:c.name, clientId:c.id,
    kind:p.kind, carrier:p.carrier, prem:p.annualPremium||0, exp:p.expiration||null }))));
  FB.forEach(c=>c.policies.forEach(p=>rows.push({
    book:"Farmers", label:c.name, client:c.name, clientId:c.id,
    kind:p.productType, carrier:"Farmers Insurance", prem:p.annualPremium||0, exp:p.renewal||null })));
  RB.forEach(p=>rows.push({
    book:"Retail", label:p.insured, client:p.insured, clientId:(p.clientKey||rbKey(p.insured)),
    kind:rbLine(p), carrier:p.broker, prem:p.premium||0, exp:p.termTo||null, status:p.status, doc:rbHasDoc(p) }));
  return rows;
}
function execMonths(rows){
  const out=[], now=new Date();
  for(let i=0;i<12;i++){
    const dt=new Date(now.getFullYear(), now.getMonth()+i, 1);
    out.push({ key:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"),
      label:dt.toLocaleString("en-US",{month:"short"}), year:dt.getFullYear(),
      Commercial:0, Farmers:0, Retail:0, n:0, total:0 });
  }
  const idx={}; out.forEach(m=>idx[m.key]=m);
  rows.forEach(r=>{
    if(!r.exp) return; const dt=pDate(r.exp); if(!dt) return;
    if(daysUntil(r.exp)<0) return;
    const k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");
    const m=idx[k]; if(!m) return;
    m[r.book]+=r.prem; m.n++; m.total+=r.prem;
  });
  return out;
}

/* --- tiny chart primitives (inline SVG, no libraries) --- */
function chTip(){ let t=document.getElementById("chartTip");
  if(!t){ t=document.createElement("div"); t.id="chartTip"; t.className="chtip"; document.body.appendChild(t); } return t; }
function chShow(e,html){ const t=chTip(); t.innerHTML=html; t.style.display="block";
  const r=t.getBoundingClientRect();
  t.style.left=Math.min(window.innerWidth-r.width-12, Math.max(8,e.clientX+14))+"px";
  t.style.top=Math.max(8,e.clientY-r.height-12)+"px"; }
function chHide(){ const t=document.getElementById("chartTip"); if(t) t.style.display="none"; }

/* stacked columns: 12 months x 3 books */
function execPipelineChart(months){
  const W=940,H=208,PL=62,PR=14,PT=16,PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...months.map(m=>m.total));
  /* nice round ticks: step is 1/2/2.5/5/10 x a power of ten, so the axis
     reads $0 / $25k / $50k rather than $0 / $23k / $45k */
  const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw) || 10*mag;
  const top=Math.ceil(max/step)*step;
  const band=iw/months.length, bw=Math.min(24,band-14);
  const y=v=>PT+ih-(v/top)*ih;
  const peak=months.reduce((a,m)=>m.total>a.total?m:a,months[0]);
  let g="";
  for(let i=0;i<=4;i++){ const v=top*i/4, yy=y(v);
    g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+CH_GRID+'" stroke-width="1"/>'+
       '<text x="'+(PL-9)+'" y="'+(yy+4)+'" text-anchor="end" class="ch-ax">'+
       (v>=1000 ? "$"+(v/1000).toFixed(v%1000?1:0)+"k" : "$"+v)+'</text>'; }
  months.forEach((m,i)=>{
    const cx=PL+band*i+band/2, x=cx-bw/2;
    let acc=0;
    ["Commercial","Farmers","Retail"].forEach(bk=>{
      const v=m[bk]; if(v<=0) return;
      const y1=y(acc+v), y0=y(acc), h=Math.max(1,y0-y1-2);
      const isTop = acc+v >= m.total-0.01;
      g+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+h+'" fill="'+CHART[bk]+'"'+
         (isTop?' rx="4" ry="4"':'')+
         ' tabindex="0" class="ch-seg" onmousemove="chShow(event,\''+
           esc(m.label+" "+m.year+" &middot; "+bk).replace(/'/g,"&#39;")+': <b>'+money0(v)+'</b>\')" '+
         'onmouseleave="chHide()" onfocus="chHide()"><title>'+esc(m.label+" "+m.year+" "+bk+" "+money0(v))+'</title></rect>';
      acc+=v;
    });
    if(m.total>0 && m.key===peak.key)
      g+='<text x="'+cx+'" y="'+(y(m.total)-8)+'" text-anchor="middle" class="ch-lab">'+money0(m.total)+'</text>';
    g+='<text x="'+cx+'" y="'+(H-13)+'" text-anchor="middle" class="ch-ax">'+m.label+'</text>';
  });
  g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#B9AC99" stroke-width="1"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="ch" role="img" aria-label="Premium coming up for renewal by month, stacked by book">'+g+'</svg>';
}

/* horizontal bars, one hue, optional emphasis on the first/dominant row */
function execBars(items, opts){
  opts=opts||{};
  const max=Math.max(1,...items.map(i=>i.value));
  return '<div class="hb">'+items.map((it,n)=>{
    const pct=(it.value/max)*100;
    const col = opts.emphasis ? (n===0?CH_ACCENT:CH_MUTE) : (it.color||CH_ACCENT);
    return '<div class="hb-row'+(it.onclick?" hb-click":"")+'"'+(it.onclick?' tabindex="0" onclick="'+it.onclick+'"':'')+'>'+
      '<div class="hb-l" title="'+esc(it.label)+'">'+esc(it.label)+
        (it.sub?'<span class="hb-sub">'+esc(it.sub)+'</span>':'')+'</div>'+

      '<div class="hb-v">'+money0(it.value)+(it.pct!=null?'<span class="hb-pct">'+it.pct.toFixed(0)+'%</span>':'')+'</div>'+
    '</div>';
  }).join("")+'</div>';
}
function execMeter(label, num, den, note, tone){
  const pct = den? (num/den)*100 : 0;
  const col = tone==="bad" ? CH_ACCENT : tone==="warn" ? "#C08438" : "#1F7A57";
  return '<div class="mtr"><div class="mtr-top"><span class="mtr-l">'+esc(label)+'</span>'+
    '<span class="mtr-v">'+Math.round(pct)+'%</span></div>'+
    '<div class="mtr-track"><div class="mtr-fill" style="width:'+pct.toFixed(1)+'%;background:'+col+'"></div></div>'+
    '<div class="mtr-s">'+num+' of '+den+(note?" &middot; "+esc(note):"")+'</div></div>';
}

/* ---------- executive scorecard ----------
   Metrics that this platform can genuinely compute are shown with a gauge
   against a goal you set. Metrics that need activity data we do not hold
   (appointments, calls, close rate) are shown as NO DATA with the reason,
   rather than filled with a plausible-looking number. */
const GOALS = { premium:null, policies:null, newClients:null };
const PERIODS = {
  "90":{label:"Next 90 days", days:90}, "180":{label:"Next 180 days", days:180},
  "365":{label:"Next 12 months", days:365}, "all":{label:"Whole book", days:99999}
};
function goalSet(k,v){ const n=Number(String(v).replace(/[^0-9.]/g,"")); GOALS[k]= n>0? n : null; render(); }
function execFilter(k,v){ S["ex"+k]=v; render(); }

function gauge(pct, tone){
  const p=Math.max(0,Math.min(100,pct||0)), R=26, C=2*Math.PI*R;
  const col = tone==="bad"?"#A83E4B":tone==="warn"?"#C08438":"#1F7A57";
  return '<svg class="gg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="'+R+'" fill="none" stroke="var(--pale)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+(C*p/100).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 32 32)"/>'+
    '<text x="32" y="36" text-anchor="middle" class="gg-t">'+Math.round(p)+'%</text></svg>';
}

function scoreCard(o){
  const has = o.value!=null;
  if(!has) return '<div class="sc sc-nd">'+
    '<div class="sc-h"><span class="sc-i">'+o.icon+'</span><div class="sc-l">'+esc(o.label)+'</div>'+
      '<span class="sc-nb">No data</span></div>'+

function execGo(tab, id){ setModule(tab); if(id){ S.client=id; render(); } }

function execExceptions(rows, expired, undated, priced, docs){
  const items=[];
  expired.forEach(r=>items.push({sev:"critical", what:esc(r.label)+" \u2014 "+esc(r.kind),
    why:"Expired "+esc(r.exp)+" ("+Math.abs(daysUntil(r.exp))+" days ago) with no renewal recorded.",
    amt:r.prem, book:r.book, id:r.clientId}));
  RB.filter(p=>p.status==="Canceled").forEach(p=>items.push({sev:"serious",
    what:esc(p.insured)+" \u2014 "+esc(rbLine(p)), why:"Policy shows Canceled in the carrier list; confirm it was rewritten.",
    amt:p.premium||0, book:"Retail", id:(p.clientKey||rbKey(p.insured))}));
  /* A dec whose term has already run out while the carrier list still shows the
     policy in force means the renewal dec never came in. That is a different
     problem from a lapse, and a different one from a dec that simply covers a
     different term than the list, so it gets its own, louder line. */
  const rbLapsed = p => p.termTo && p.status==="In Force" && daysUntil(p.termTo)<0;
  RB.filter(rbLapsed).forEach(p=>items.push({sev:"serious",
    what:esc(p.insured)+" \u2014 renewal dec outstanding",
    why:"Dec on file expired "+esc(p.termTo)+" ("+Math.abs(daysUntil(p.termTo))+" days ago) but the carrier list still shows the policy in force. Pull the renewal dec.",
    amt:p.premium||0, book:"Retail", id:(p.clientKey||rbKey(p.insured))}));
  RB.filter(p=>p.termNote && !rbLapsed(p)).forEach(p=>items.push({sev:"warning", what:esc(p.insured)+" \u2014 term mismatch",
    why:"The attached declarations page covers a different term than the policy list shows.",
    amt:p.premium||0, book:"Retail", id:(p.clientKey||rbKey(p.insured))}));
  RB.filter(p=>p.numberNote||p.nameNote).forEach(p=>items.push({sev:"warning",
    what:esc(p.insured)+" \u2014 record mismatch",
    why:(p.numberNote?"Policy number":"Insured name")+" on the document differs from the carrier list.",
    amt:p.premium||0, book:"Retail", id:(p.clientKey||rbKey(p.insured))}));
  items.push({sev:"warning", what:undated+" policies have no expiration date",
    why:"They cannot appear in the renewal pipeline until a term date is on file.", amt:null});
  items.push({sev:"warning", what:(rows.length-priced)+" policies have no premium",
    why:"Book totals understate reality by this many policies.", amt:null});
  items.push({sev:"warning", what:(rows.length-docs)+" policies have no document",
    why:"No dec sheet or information page attached to verify terms against.", amt:null});
  const order={critical:0,serious:1,warning:2};
  items.sort((a,b)=>order[a.sev]-order[b.sev] || (b.amt||0)-(a.amt||0));
  return '<div class="exc">'+items.map(i=>
    '<div class="exc-r'+(i.id?" exc-click":"")+'"'+(i.id?' tabindex="0" onclick="execGo(\''+BOOK_TAB[i.book]+'\',\''+String(i.id).replace(/'/g,"")+'\')"':'')+'>'+
      '<span class="exc-b exc-'+i.sev+'">'+i.sev+'</span>'+
      '<div class="exc-t"><div class="exc-w">'+i.what+'</div><div class="exc-y">'+i.why+'</div></div>'+
      '<div class="exc-a mono">'+(i.amt!=null&&i.amt>0?money0(i.amt):"")+'</div>'+
    '</div>').join("")+'</div>';
}

/* ---------- retail: clients ----------
   One profile per insured. Policies are grouped on the insured's name exactly as
   the carrier spells it; nothing is fuzzy-merged, because two people can share a
   name and a wrong merge is worse than two rows. Near-matches are surfaced on the
   profile as a prompt instead. */
const rbKey = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function rbClients(){
  const map = new Map();
  RB.forEach(p=>{
    const k = p.clientKey || rbKey(p.insured);
    if(!map.has(k)) map.set(k, { key:k, name:p.insured, policies:[], aliases:new Set() });
    if(map.get(k).name !== p.insured) map.get(k).aliases.add(p.insured);
    map.get(k).policies.push(p);
  });
  return [...map.values()].map(cl=>{
    const ps = cl.policies;
    const dates = ps.map(p=>pDate(p.termTo || p.effective)).filter(Boolean).sort((a,b)=>a-b);
    return Object.assign(cl, {
      count: ps.length,
      accounts: [...new Set(ps.map(p=>p.account).filter(Boolean))],
      brokers:  [...new Set(ps.map(p=>p.broker))],
      lines:    [...new Set(ps.map(rbLine))].sort(),
      premium:  ps.reduce((s,p)=>s+(p.premium||0),0),
      priced:   ps.filter(p=>p.premium!=null).length,
      docs:     ps.filter(rbHasDoc).length,
      active:   ps.filter(p=>p.status!=="Canceled").length,
      canceled: ps.filter(p=>p.status==="Canceled").length,
      nextDate: dates.length ? dates[dates.length-1] : null
    });
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
function rbNearMatches(cl){
  const a = rbKey(cl.name);
  return rbClients().filter(o=>o.key!==cl.key &&
    (o.key.includes(a) || a.includes(o.key)) && Math.min(o.key.length,a.length) >= 6);
}
function rbLineTotals(scope){
  const out = {};
  scope.forEach(p=>{
    const k = rbLine(p);
    if(!out[k]) out[k] = { line:k, count:0, priced:0, premium:0, withFees:0 };
    out[k].count++;
    if(p.premium != null){ out[k].priced++; out[k].premium += p.premium; out[k].withFees += (p.totalWithFees!=null?p.totalWithFees:p.premium); }
  });
  return Object.values(out).sort((a,b)=>b.premium-a.premium);
}
function rbPremiumBand(scope){
  const lines = rbLineTotals(scope);
  const priced = scope.filter(p=>p.premium!=null).length;
  const total  = scope.reduce((s,p)=>s+(p.premium||0),0);
  const fees   = scope.reduce((s,p)=>s+(p.totalWithFees!=null?p.totalWithFees:(p.premium||0)),0);
  return '<div class="rb-band">'+
    lines.map(l=>
      '<div class="rb-tile"><div class="rb-tile-l">'+esc(l.line)+' premium</div>'+

    '<div class="rb-tile rb-tile-total"><div class="rb-tile-l">Total brokered premium</div>'+
      '<div class="rb-tile-v">'+money0(total)+'</div>'+
      '<div class="rb-tile-s">'+money0(fees)+' incl. fees \u00b7 '+priced+' of '+scope.length+' policies priced</div></div>'+
    (priced < scope.length ?
      '<div class="rb-band-note">Running total only \u2014 '+(scope.length-priced)+
      ' policies have no premium on file yet. Attach a declarations page to add one.</div>' : '')+
  '</div>';
}

const BKT = [
  { key:"a", label:"Next 30 days",  lo:0,  hi:30,    color:"#8C3038" },
  { key:"b", label:"31 to 90 days", lo:31, hi:90,    color:"#B57F35" },
  { key:"c", label:"91+ days",      lo:91, hi:99998, color:"#3F6B54" }
];
function execBuckets(rows){
  const b = BKT.map(k=>({...k, prem:0, n:0}));
  rows.forEach(r=>{
    if(!r.exp) return;
    const d = daysUntil(r.exp);
    if(d<0) return;
    const hit = b.find(k=>d>=k.lo && d<=k.hi);
    if(hit){ hit.prem += (r.prem||0); hit.n++; }
  });
  const max = Math.max(1,...b.map(k=>k.prem));
  return '<div class="bkt">'+b.map(k=>{
    const h = k.prem>0 ? Math.max(44, Math.round(k.prem/max*150)) : 0;
    return '<div class="bkt-c">'+
      (k.prem>0
        ? '<div class="bkt-b" title="'+esc(k.label)+' \u2014 '+money0(k.prem)+' across '+k.n+' policies" '+
          'style="height:'+h+'px;background:'+k.color+'"><span class="bkt-v">'+money0(k.prem)+'</span></div>'
        : '<div class="bkt-b bkt-0" style="height:44px"><span class="bkt-v">None</span></div>')+
      '<div class="bkt-l">'+esc(k.label)+'</div>'+
      '<div class="bkt-s">'+k.n+' polic'+(k.n===1?"y":"ies")+'</div>'+
    '</div>';
  }).join("")+'</div>';
}

      '<h2>'+esc(MODULES[m].title)+'</h2><p>'+esc(MODULES[m].ph)+'</p></div></div>';

  if(m==="operate"){
    return showOperateView();
  }
  if(m==="retail"){
    return S.client ? renderRetailClient() : renderRetailList();
  }
  if(m==="executive"){

}

/* ---------- renewal alerts ----------
   One window, one definition, used by both the rail badge and the alert strip:
   a policy counts as due when its renewal date is today or later and no more
   than ALERT_WINDOW days out. Already-past renewals are a different problem and
   are deliberately not folded in here \u2014 they would make the badge read like
   an urgency it isn't. */
const ALERT_WINDOW = 30;
function farmersDueSoon(){
  const out=[];
  FB.forEach(c=>c.policies.forEach(p=>{
    const d=daysUntil(p.renewal);
    if(d>=0 && d<=ALERT_WINDOW) out.push({clientId:c.id, client:c.name, p:p, days:d});
  }));
  return out.sort((a,b)=>a.days-b.days);
}
function farmersNextUp(){
  let best=null;
  FB.forEach(c=>c.policies.forEach(p=>{
    const d=daysUntil(p.renewal);
    if(d<0) return;
    if(!best || d<best.days) best={clientId:c.id, client:c.name, p:p, days:d};
  }));
  return best;
}
function paintNavAlerts(){
  const el=document.querySelector('#nav button[data-m="farmers"] .nav-alert');
  if(!el) return;
  const n=farmersDueSoon().length;
  el.textContent = n>99 ? "99+" : String(n);
  el.className = "nav-alert" + (n>0 ? " on" : "");
  const btn=el.closest("button");
  if(btn) btn.title = n>0
    ? n+" Farmers polic"+(n===1?"y renews":"ies renew")+" within "+ALERT_WINDOW+" days"
    : "No Farmers renewals in the next "+ALERT_WINDOW+" days";
}
const WARN_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 9v5M12 17.5v.01"/><path d="M10.3 3.9 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
function farmersAlertBlock(){
  const due=farmersDueSoon();
  if(!due.length){
    const nx=farmersNextUp();
    return '<div class="ralert quiet">'+
      '<div class="ralert-h">'+WARN_ICON+'<h3>Renewals \u2014 next '+ALERT_WINDOW+' days</h3>'+
        '<span class="ralert-n">All clear</span></div>'+
      '<p class="ralert-note">Nothing in the Farmers book renews before '+
        esc(new Date(TODAY.getTime()+ALERT_WINDOW*86400000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))+'. '+
        (nx? 'Next up is <b>'+esc(nx.client)+'</b> \u2014 '+esc(nx.p.productType)+' '+esc(nx.p.policyNumber)+
             ', '+esc(nx.p.renewal)+' ('+nx.days+' days out).' : '')+'</p></div>';
  }
  const total=due.reduce((s,r)=>s+(r.p.annualPremium||0),0);
  return '<div class="ralert">'+
    '<div class="ralert-h">'+WARN_ICON+'<h3>Renewing within '+ALERT_WINDOW+' days</h3>'+
      '<span class="ralert-n">'+due.length+' polic'+(due.length===1?"y":"ies")+' \u00b7 '+money0(total)+'</span></div>'+
    due.map(r=>
      '<div class="ralert-row" tabindex="0" role="button" onclick="openClient(\''+r.clientId+'\')" onkeydown="kd(event,\''+r.clientId+'\')">'+
        '<div><div class="ralert-nm">'+esc(r.client)+'</div>'+
          '<div class="ralert-sub">'+esc(r.p.productType)+' \u00b7 '+esc(r.p.policyNumber)+'</div></div>'+
        '<div class="ralert-dt mono">'+esc(r.p.renewal)+' '+esc(r.p.renewalTime||"")+'</div>'+
        '<div class="ralert-d mono">'+(r.days===0?"today":r.days+"d")+'</div>'+
        '<div class="ralert-p mono">'+money0(r.p.annualPremium||0)+'</div>'+
      '</div>').join("")+
    '</div>';
}

/* ---------- global search ----------
   One index over both books. Policy numbers are matched on their digits and
   letters only, so "60586-95-40", "605869540" and "6058695" all find the same
   policy no matter how the carrier or the export happens to format it. */
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const SEARCH_INDEX = (() => {
  const rows = [];
  (DATA.commercial||[]).forEach(cl=>{
    (cl.locations||[]).forEach(loc=>{
      (loc.policies||[]).forEach(p=>{
        rows.push({ book:"commercial", bookLabel:"Commercial Book", clientId:cl.id,
          title:loc.name, sub:(p.kind||"")+" \u00b7 "+(p.carrier||"")+" \u00b7 "+(cl.dba||cl.name),
          num:p.policyNumber, premium:p.annualPremium, hasDoc:false,
          hay:[loc.name,loc.address,cl.name,cl.dba,cl.contact,p.policyNumber,p.carrier,p.kind,p.coverageType].map(norm).join(" ") });
      });
    });
  });
  RB.forEach(p=>{
    rows.push({ book:"retail", bookLabel:"P&C Brokered \u00b7 "+p.broker, clientId:(p.clientKey || rbKey(p.insured)),
      title:p.insured, sub:rbLine(p)+" \u00b7 "+p.status+" \u00b7 eff "+p.effective,
      num:p.policyNumber+(rbPartial(p,"policyNumber")?"\u2026":""), premium:(p.premium!=null?p.premium:null), hasDoc:rbHasDoc(p),
      hay:[p.insured,p.coInsured,p.account,p.policyNumber,p.bambooId,p.riskAddress,p.product,rbLine(p),p.program,p.status,p.broker,p.carrier].map(norm).join(" ") });
  });
  (DATA.farmers||[]).forEach(cl=>{
    (cl.policies||[]).forEach(p=>{
      rows.push({ book:"farmers", bookLabel:"Farmers Commercial", clientId:cl.id,
        title:cl.name, sub:(p.productType||"")+" \u00b7 renews "+(p.renewal||""),
        num:p.policyNumber, premium:p.annualPremium, hasDoc:!!FARMERS_DECS[p.id],
        hay:[cl.name,p.insured,p.policyNumber,p.billingAccount,p.productType,p.zip,p.aor].map(norm).join(" ") });
    });
  });
  return rows;
})();
let gSel = 0, gHits = [];

function gSearch(q){
  const n = norm(q);
  if(n.length < 2) return [];
  return SEARCH_INDEX
    .map(r=>{
      const i = r.hay.indexOf(n);
      if(i < 0) return null;
      // exact policy-number hits first, then earlier matches
      return {r, score:(norm(r.num)===n ? 0 : norm(r.num).startsWith(n) ? 1 : 2) * 1000 + i};
    })
    .filter(Boolean)
    .sort((a,b)=>a.score-b.score)
    .slice(0,40)
    .map(x=>x.r);
}

function gRender(){
  const box = document.getElementById("gres");
  if(!gHits.length){
    box.innerHTML = '<div class="gempty">No policy or business matches that.</div>';
    box.style.display = "block"; return;
  }
  let html = "", lastBook = null;
  gHits.forEach((r,i)=>{
    if(r.bookLabel !== lastBook){ html += '<div class="ghead">'+esc(r.bookLabel)+'</div>'; lastBook = r.bookLabel; }
    html += '<button class="gitem'+(i===gSel?" sel":"")+'" onclick="gGo('+i+')">'+
      '<span><span class="gname">'+esc(r.title)+
        (r.hasDoc?'<span class="gdoc">DOC</span>':'')+'</span>'+
        '<div class="gsub">'+esc(r.sub)+'</div></span>'+
      '<span style="text-align:right"><span class="gnum">'+esc(r.num)+'</span>'+
        '<div class="gsub">'+(r.premium==null ? "\u2014" : money0(r.premium))+'</div></span>'+
    '</button>';
  });
  box.innerHTML = html;
  box.style.display = "block";
}

function gClose(){ const b=document.getElementById("gres"); if(b) b.style.display="none"; }

function gGo(i){
  const r = gHits[i]; if(!r) return;
  gClose();
  document.getElementById("gq").value = "";
  document.getElementById("gclear").style.display = "none";
  setModule(r.book);
  openClient(r.clientId);
}

/* ---------- boot ---------- */
document.querySelectorAll("#nav button[data-m]").forEach(b=>
  b.addEventListener("click",()=>{ if(!b.disabled) setModule(b.dataset.m); }));

const gq = document.getElementById("gq"), gclear = document.getElementById("gclear");
gq.addEventListener("input", ()=>{
  const v = gq.value;
  gclear.style.display = v ? "block" : "none";
  if(norm(v).length < 2){ gClose(); return; }
  gHits = gSearch(v); gSel = 0; gRender();
});
gq.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ gClose(); gq.blur(); return; }
  if(!gHits.length) return;
  if(e.key === "ArrowDown"){ e.preventDefault(); gSel = Math.min(gSel+1, gHits.length-1); gRender(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); gSel = Math.max(gSel-1, 0); gRender(); }
  else if(e.key === "Enter"){ e.preventDefault(); gGo(gSel); }
});
gq.addEventListener("focus", ()=>{ if(gHits.length && norm(gq.value).length>1) gRender(); });
gclear.addEventListener("click", ()=>{ gq.value=""; gclear.style.display="none"; gClose(); gq.focus(); });
document.addEventListener("click", e=>{ if(!e.target.closest(".gsearch")) gClose(); });
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); gq.focus(); gq.select(); }
});
